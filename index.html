              e('div', { className: 'text-sm text-gray-500 mb-1' }, '\u5df2\u5b8c\u6210'),
              e('div', { className: 'text-2xl font-bold text-green-600' }, stats.completed)
            )
          ),
          activeTab === 'create'
            ? e(TicketForm, { onSubmit: addTicket, onCancel: function() { setActiveTab('list'); } })
            : e(React.Fragment, null,
                e(FilterBar, { filters: filters, onFilterChange: setFilters }),
                e(TicketList, { tickets: filteredTickets, onUpdateStatus: updateStatus, onDelete: deleteTicket })
              )
        )
      );
    }

    // Render
    var rootEl = document.getElementById('root');
    if (rootEl) {
      var root = ReactDOM.createRoot(rootEl);
      root.render(e(App));
    }
  </script>
</body>
</html>
